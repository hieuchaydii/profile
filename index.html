<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💞</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top left, #ffdde1, #ee9ca7);
      overflow: hidden;
      height: 100vh;
      position: relative;
      font-family: "Poppins", sans-serif;
    }

    .message {
      position: absolute;
      padding: 14px 22px;
      border-radius: 16px;
      color: white;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: scale(0.8);
      animation: pop 1s ease forwards, float 4s ease-in-out infinite;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Trái tim bay */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.7);
      animation: fall 6s linear infinite;
      user-select: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <script>
    const messages = [
      "你要想我 💭",
      "我爱你 ❤️",
      "我好想你 🥺",
      "你想吃糖炒栗子吗? 🌰",
      "你想他了吗 💕"
    ];

    const colors = [
      "#ff99ac",
      "#ffb6c1",
      "#ffc3a0",
      "#ff8c69",
      "#d8bfd8"
    ];

    function createMessage() {
      const msg = document.createElement("div");
      msg.classList.add("message");
      msg.textContent = messages[Math.floor(Math.random() * messages.length)];
      msg.style.background = colors[Math.floor(Math.random() * colors.length)];
      msg.style.left = Math.random() * 80 + "vw";
      msg.style.top = Math.random() * 80 + "vh";
      msg.style.animationDelay = `${Math.random()}s`;
      document.body.appendChild(msg);

      setTimeout(() => {
        msg.remove();
      }, 5000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    // popup messages
    setInterval(createMessage, 300);

    // hearts animation
    setInterval(createHeart, 200);
  </script>
</body>
</html>
